<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copilot Prompts - Sellers</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; }
  body { background:#EBEBEB; color:#333; padding-bottom:40px; }

  /* HEADER estilo Mercado Libre */
  .top-sticky { position:sticky; top:0; z-index:100; box-shadow:0 2px 6px rgba(0,0,0,0.15); }
  header {
    background:#FFE600; padding:18px 24px; display:flex; align-items:center;
    justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  .logo { display:flex; align-items:center; gap:10px; }
  .logo-icon {
    width:38px; height:38px; background:#333; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }
  .logo h1 { font-size:20px; color:#333; }
  .logo p { font-size:12px; color:#444; }
  .fav-toggle {
    background:#333; color:#FFE600; border:none; padding:8px 14px;
    border-radius:20px; font-size:13px; cursor:pointer; font-weight:600;
  }
  .fav-toggle.active { background:#3483FA; color:#fff; }
  .feedback-btn {
  background:#00A650; color:#fff; border:none; padding:8px 14px;
  border-radius:20px; font-size:13px; cursor:pointer; font-weight:600;
  text-decoration:none; display:inline-flex; align-items:center; gap:4px;
  transition:background .15s;
}
.feedback-btn:hover { background:#008C44; }

  /* FILTER BAR */
  .filter-bar { background:#fff; padding:14px 20px; }
  .search-box {
    width:100%; max-width:500px; margin:0 auto 14px auto; display:block;
    padding:12px 16px; border-radius:8px; border:1px solid #ccc; font-size:14px;
  }
  .search-box:focus { outline:2px solid #3483FA; border-color:#3483FA; }

  .filter-label { font-size:12px; color:#888; font-weight:700; text-transform:uppercase; margin:8px 0 6px 0; text-align:center; }
  .filter-group { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:6px; }
  .pill {
    padding:7px 14px; border-radius:20px; border:1.5px solid #ddd; background:#fafafa;
    cursor:pointer; font-size:13px; font-weight:600; color:#444; transition:all .15s;
    white-space:nowrap;
  }
  .pill:hover { border-color:#3483FA; }
  .pill.active { background:#3483FA; color:#fff; border-color:#3483FA; }
  .pill.active.proceso { background:#333; border-color:#333; }

  .result-count { text-align:center; font-size:13px; color:#777; margin:14px 0 4px 0; }

  /* SECCIONES agrupadas por proceso */
  .section { max-width:1200px; margin:24px auto 0 auto; padding:0 16px; }
  .section-title {
    font-size:17px; font-weight:700; color:#333; margin-bottom:12px;
    display:flex; align-items:center; gap:8px; border-bottom:3px solid #FFE600; padding-bottom:6px;
  }
  .section-title .count { background:#333; color:#FFE600; font-size:12px; padding:2px 9px; border-radius:10px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:14px; }

  .card {
    background:#fff; border-radius:10px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,0.12);
    border-top:5px solid #999; display:flex; flex-direction:column; justify-content:space-between;
    transition:transform .15s, box-shadow .15s; position:relative;
  }
  .card:hover { transform:translateY(-3px); box-shadow:0 6px 16px rgba(0,0,0,0.15); }

  .card.bienvenida { border-top-color:#2e8b57; }
  .card.exploracion { border-top-color:#3483FA; }
  .card.guia { border-top-color:#FFA000; }
  .card.cierre { border-top-color:#8E24AA; }
  .card.redaccion { border-top-color:#00A650; }
  

  .star-btn {
    position:absolute; top:10px; right:10px; background:none; border:none;
    font-size:18px; cursor:pointer; color:#ccc;
  }
  .star-btn.active { color:#FFA000; }

  .badges { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; padding-right:24px; }
  .badge { font-size:10.5px; padding:3px 9px; border-radius:12px; font-weight:700; color:#fff; white-space:nowrap; }
  .badge.etapa-bienvenida { background:#2e8b57; }
  .badge.etapa-exploracion { background:#3483FA; }
  .badge.etapa-guia { background:#FFA000; }
  .badge.etapa-cierre { background:#8E24AA; }
  .badge.etapa-redaccion { background:#00A650; }
  .badge.proceso { background:#333; }

  .prompt-text { font-size:13.5px; color:#333; line-height:1.45; margin-bottom:14px; flex-grow:1; }

  .copy-btn {
    align-self:flex-start; padding:8px 14px; font-size:12.5px; border:none;
    border-radius:20px; background:#FFE600; color:#333; cursor:pointer; font-weight:700;
  }
  .copy-btn:hover { background:#FFD400; }
  .copy-btn.copied { background:#00A650; color:#fff; }

  .no-results { text-align:center; color:#888; margin-top:50px; font-size:15px; }
  footer { text-align:center; margin-top:40px; color:#999; font-size:12px; }
</style>
</head>
<body>

<div class="top-sticky">

</div>

<div id="container"></div>

// Asignar IDs únicos
prompts.forEach((p,i)=> p.id = i);

const procesoLabels = {
  general:"🔷 General", "point-adquirir": "🖥️ point adquirir", "point-usar": "💳 point usar", "point-mantenimiento": "🔧 point mantenimiento", "point-logistica": "📦 point logística", "point-resellers": "🤝 point resellers","funcionalidades-point": "⚡ funcionalidades point","seller-wallet": "👜 seller wallet","acreditacion-cobro": "✅ acreditación cobro","anulacion-cobros": "❌ anulación cobros","mi-dinero": "💰 mi dinero","funcionalidades-mp": "🛠️ funcionalidades mp","online-payments": "🌐 online payments","tasas-incentivos": "📊 tasas e incentivos","chargeback": "🔄 chargeback","extractos-reportes": "📄 extractos y reportes","entrada-salida-dinero": "💸 entrada/salida dinero","transferencias": "➡️ transferencias"
};
const etapaLabels = {
  bienvenida:"🟢 Bienvenida", exploracion:"🔍 Exploración", guia:"🧭 Guía",
  cierre:"🔚 Cierre", redaccion:"✉️ Redacción"
};
const procesoOrder = ["general","point-adquirir","point-usar","point-mantenimiento", "point-logistica","point-resellers","funcionalidades-point","seller-wallet","acreditacion-cobro","anulacion-cobros","mi-dinero","funcionalidades-mp","online-payments","tasas-incentivos","chargeback","extractos-reportes","entrada-salida-dinero","transferencias"];

let activeProceso = "all";
let activeEtapa = "all";
let searchTerm = "";
let onlyFavs = false;
let favs = JSON.parse(localStorage.getItem("copilotFavs") || "[]");

function buildFilterPills() {
  const procesoBox = document.getElementById("procesoFilters");
  procesoBox.innerHTML = `<button class="pill proceso active" data-value="all">Todos</button>` +
    procesoOrder.map(k => `<button class="pill proceso" data-value="${k}">${procesoLabels[k]}</button>`).join("");

  const etapaBox = document.getElementById("etapaFilters");
  etapaBox.innerHTML = `<button class="pill etapa active" data-value="all">Todas</button>` +
    Object.keys(etapaLabels).map(k => `<button class="pill etapa" data-value="${k}">${etapaLabels[k]}</button>`).join("");

  procesoBox.querySelectorAll(".pill").forEach(btn => {
    btn.addEventListener("click", () => {
      procesoBox.querySelectorAll(".pill").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      activeProceso = btn.dataset.value;
      render();
    });
  });
  etapaBox.querySelectorAll(".pill").forEach(btn => {
    btn.addEventListener("click", () => {
      etapaBox.querySelectorAll(".pill").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      activeEtapa = btn.dataset.value;
      render();
    });
  });
}

function toggleFav(id) {
  if (favs.includes(id)) favs = favs.filter(f=>f!==id);
  else favs.push(id);
  localStorage.setItem("copilotFavs", JSON.stringify(favs));
}

function render() {
  const container = document.getElementById("container");
  const noResults = document.getElementById("noResults");
  const resultCount = document.getElementById("resultCount");
  container.innerHTML = "";

  let filtered = prompts.filter(p => {
    const mProc = activeProceso==="all" || p.p===activeProceso;
    const mEtapa = activeEtapa==="all" || p.e===activeEtapa;
    const mSearch = p.t.toLowerCase().includes(searchTerm.toLowerCase());
    const mFav = !onlyFavs || favs.includes(p.id);
    return mProc && mEtapa && mSearch && mFav;
  });

  resultCount.textContent = `Mostrando ${filtered.length} de ${prompts.length} prompts`;

  if (filtered.length === 0) { noResults.style.display="block"; return; }
  noResults.style.display = "none";

  procesoOrder.forEach(procKey => {
    const items = filtered.filter(p => p.p === procKey);
    if (items.length === 0) return;

    const section = document.createElement("div");
    section.className = "section";
    section.innerHTML = `<div class="section-title">${procesoLabels[procKey]} <span class="count">${items.length}</span></div>
      <div class="grid" id="grid-${procKey}"></div>`;
    container.appendChild(section);

    const grid = section.querySelector(`#grid-${procKey}`);
    items.forEach(p => {
      const card = document.createElement("div");
      card.className = `card ${p.e}`;
      const isFav = favs.includes(p.id);
      card.innerHTML = `
        <button class="star-btn ${isFav?'active':''}">${isFav?'⭐':'☆'}</button>
        <div class="badges">
          <span class="badge etapa-${p.e}">${etapaLabels[p.e]}</span>
        </div>
        <div class="prompt-text">${p.t}</div>
        <button class="copy-btn">📋 Copiar prompt</button>
      `;
      card.querySelector(".star-btn").addEventListener("click", (e)=>{
        toggleFav(p.id);
        render();
      });
      card.querySelector(".copy-btn").addEventListener("click", (e)=>{
        navigator.clipboard.writeText(p.t);
        e.target.textContent = "✅ Copiado";
        e.target.classList.add("copied");
        setTimeout(()=>{ e.target.textContent="📋 Copiar prompt"; e.target.classList.remove("copied"); }, 1500);
      });
      grid.appendChild(card);
    });
  });
}

document.getElementById("searchBox").addEventListener("input", (e)=>{ searchTerm=e.target.value; render(); });
document.getElementById("favToggle").addEventListener("click", (e)=>{
  onlyFavs = !onlyFavs;
  e.target.classList.toggle("active", onlyFavs);
  render();
});

buildFilterPills();
render();
</script>
